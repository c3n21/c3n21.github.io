name: Build and Deploy

env:
  PDF_NAME: "ZhifanChen.pdf"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set CV_LOCATION environment variable
        run: |
          TAG_NAME=${GITHUB_REF_NAME#refs/tags/}
          PDF_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${PDF_NAME}"
          echo "CV_LOCATION=$PDF_URL" >> $GITHUB_ENV

      - uses: ./.github/actions/build-with-cv
        with:
          cv: ${{ secrets.CV }}

      - name: Run test suite
        run: pnpm exec vitest run

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/

      - name: Cleanup src/cv.json
        if: always()
        run: rm -f src/cv.json

  build-cv:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-with-cv
        with:
          cv: ${{ secrets.CV }}
        env:
          CV: light

      - name: Generate PDF from built site
        run: |
          pnpm run cv:pdf

      - name: Upload CV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PDF_NAME }}
          path: ${{ env.PDF_NAME }}

      - name: Cleanup src/cv.json
        if: always()
        run: rm -f src/cv.json

  deploy-cv:
    needs: build-cv
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download CV Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PDF_NAME }}
          path: .

      - name: Upload PDF as Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: ${{ env.PDF_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    needs: [build-web, deploy-cv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
